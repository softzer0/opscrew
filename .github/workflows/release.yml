# Stages the `opscrew` CLI on npm when a `v<version>` tag is pushed, through npm's trusted
# publishing (OIDC): no token is stored. The trusted publisher allows staging only, so the version
# goes public when a maintainer approves it with 2FA on npmjs.com (Staged Packages) or with
# `npm stage approve <id>`. The tag must equal packages/cli's version. The full gate runs before a
# tag is pushed; this job checks the build.
name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # Staged publishing needs npm 11.15.0 or later.
      - run: npm install -g npm@11.21.1
      - run: pnpm install --frozen-lockfile
      - name: The tag matches the package's version
        run: |
          version="$(node -p "require('./packages/cli/package.json').version")"
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match packages/cli's version ${version}"
            exit 1
          fi
      - run: pnpm turbo run typecheck --filter=opscrew
      - run: pnpm --filter opscrew build
      - name: The bundle runs
        run: node packages/cli/dist/opscrew.js --version
      - run: npm stage publish
        working-directory: packages/cli
