# OpsCrew's own check of the localhost target (FR-1531, quickstart "6."): the localhost Docker pass
# with real Docker on Linux, the same pass on Intel macOS with Colima (non-blocking), and the
# localhost unit and command tests, with Docker faked, on Windows and Apple silicon (whose runners cannot run Linux containers). No GitHub runner is ever registered.
name: Localhost

on:
  push:
    branches: [main]
    paths:
      - packages/agents/src/localhost/**
      - packages/iac-templates/src/edge/**
      - packages/iac-templates/src/runtime/**
      - packages/connectors/ssh-host/src/local.ts
      - packages/connectors/ssh-host/src/local.test.ts
      - packages/core/src/crypto/x509.ts
      - packages/core/src/crypto/x509.test.ts
      - examples/**
      - packages/cli/test/e2e/localhost*.ts
      - .github/workflows/localhost.yml
  pull_request:
    paths:
      - packages/agents/src/localhost/**
      - packages/iac-templates/src/edge/**
      - packages/iac-templates/src/runtime/**
      - packages/connectors/ssh-host/src/local.ts
      - packages/connectors/ssh-host/src/local.test.ts
      - packages/core/src/crypto/x509.ts
      - packages/core/src/crypto/x509.test.ts
      - examples/**
      - packages/cli/test/e2e/localhost*.ts
      - .github/workflows/localhost.yml
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: localhost-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-linux:
    name: Docker pass (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.13.1
          tofu_wrapper: false
      - name: The localhost Docker pass
        env:
          OPSCREW_DOCKER_TESTS: "1"
        run: pnpm turbo run test --filter=opscrew -- test/e2e/localhost.test.ts

  docker-macos-intel:
    name: Docker pass (Intel macOS, Colima)
    runs-on: macos-15-intel
    # Intel macOS runners have a shelf life and Colima takes about 6 minutes to start (research R5).
    # The off-Linux Buildpacks build runs by hand on Windows: here a plain `docker pull` of the
    # Paketo builder kills Colima's VM within seconds (research.md).
    continue-on-error: true
    timeout-minutes: 75
    env:
      # The runner has 4 vCPU and 14 GB; the second run's VM, with 3 CPUs and 6 GB, died under two
      # environments' stacks.
      COLIMA_FLAGS: --cpu 4 --memory 10 --disk 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.13.1
          tofu_wrapper: false
      - name: Start Docker in Colima
        run: |
          set -euo pipefail
          brew install colima docker docker-compose docker-buildx
          mkdir -p "$HOME/.docker/cli-plugins"
          for plugin in docker-compose docker-buildx; do
            ln -sfn "$(brew --prefix)/opt/$plugin/bin/$plugin" "$HOME/.docker/cli-plugins/$plugin"
          done
          colima start $COLIMA_FLAGS
          docker info --format '{{.ServerVersion}} {{.OSType}} {{.MemTotal}}'
          docker compose version
          # Colima shares the home folder with its VM, so the stack's bind mounts resolve there.
          mkdir -p "$HOME/opscrew-test-tmp"
          echo "OPSCREW_TEST_TMP=$HOME/opscrew-test-tmp" >> "$GITHUB_ENV"
      - name: The localhost Docker pass
        env:
          OPSCREW_DOCKER_TESTS: "1"
        run: pnpm turbo run test --filter=opscrew -- test/e2e/localhost.test.ts
      # After the pass, the memory and disk left, so the cause shows when the VM dies.
      - name: Room on the host and in Colima's VM
        if: always()
        run: |
          df -h / || true
          colima ssh -- sh -c 'free -m; df -h /var/lib/docker' || true
      # When the pass fails, what Colima's VM and its Docker say: a daemon that crashed or ran out of
      # memory, or a full disk, shows here.
      - name: Colima's VM and its Docker after a failure
        if: ${{ failure() }}
        run: |
          colima status || true
          tail -n 80 "$HOME/.colima/_lima/colima/ha.stderr.log" || true
          tail -n 60 "$HOME"/.colima/_lima/colima/serial*.log || true
          docker info --format '{{.ServerVersion}} {{.MemTotal}} {{.Containers}} containers' || true
          colima ssh -- sh -c 'uptime; free -m; df -h / /var/lib/docker; sudo dmesg | tail -n 60; sudo journalctl -u docker -u containerd --no-pager -n 200' || true

  unit:
    name: Localhost unit tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Agents (the localhost target)
        run: pnpm --filter @opscrew/agents exec vitest run src/localhost
      - name: Templates (the localhost Compose file and edge)
        run: pnpm --filter @opscrew/iac-templates exec vitest run src/edge/localhost
      - name: The local executor
        run: pnpm --filter @opscrew/connector-ssh-host exec vitest run src/local.test.ts
      - name: The local CA's certificates
        run: pnpm --filter @opscrew/core exec vitest run src/crypto/x509.test.ts
      - name: The CLI's localhost commands
        run: pnpm --filter opscrew exec vitest run src/commands/environments.test.ts src/commands/destroy-localhost.test.ts
