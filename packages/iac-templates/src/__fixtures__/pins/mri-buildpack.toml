api = "0.7"

[buildpack]
  homepage = "https://github.com/paketo-buildpacks/mri"
  id = "paketo-buildpacks/mri"
  name = "Paketo Buildpack for MRI"
  version = "{{.version}}"

  [[buildpack.licenses]]
    type = "Apache-2.0"

[metadata]
  include-files = ["bin/build", "bin/detect", "buildpack.toml"]
  [metadata.default-versions]
    ruby = "3.4.*"

  [[metadata.dependencies]]
    arch = "amd64"
    id = "ruby"
    name = "Ruby"
    stacks = ["io.buildpacks.stacks.jammy"]
    version = "3.3.11"

  [[metadata.dependencies]]
    arch = "amd64"
    id = "ruby"
    name = "Ruby"
    stacks = ["io.buildpacks.stacks.noble"]
    version = "3.4.10"

    [[metadata.dependencies.licenses]]
      type = "Ruby"
      version = "9.9.9"

  [[metadata.dependencies]]
    arch = "arm64"
    id = "ruby"
    name = "Ruby"
    stacks = ["io.buildpacks.stacks.noble", "io.buildpacks.stacks.resolute"]
    version = "3.4.10"

  [[metadata.dependencies]]
    arch = "amd64"
    id = "ruby"
    name = "Ruby"
    stacks = ["io.buildpacks.stacks.noble"]
    version = "3.4.9"

  [[metadata.dependencies]]
    arch = "amd64"
    id = "ruby"
    name = "Ruby"
    stacks = ["io.buildpacks.stacks.noble"]
    version = "4.0.6"

  [[metadata.dependencies]]
    id = "bundler"
    stacks = ["*"]
    version = "2.6.9"

  [[metadata.dependency-constraints]]
    constraint = "3.4.*"
    id = "ruby"
    patches = 2

[[stacks]]
  id = "io.buildpacks.stacks.noble"
