# Two databases on one PostgreSQL server, each with its own migrations, named the Rails 8 way: the
# entries (`primary`, `queue`) name the tasks (db:migrate:queue), the databases differ from them.
production:
  primary:
    adapter: postgresql
    url: <%= ENV["DATABASE_URL"] %>
    migrations_paths: db/migrate
  queue:
    adapter: postgresql
    url: <%= ENV["DATABASE_URL"] %>_queue
    migrations_paths: db/queue_migrate
