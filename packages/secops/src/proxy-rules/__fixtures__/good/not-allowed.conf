# Every directive nginx additions may use; `proxy_set_header` only outside any block.
proxy_set_header X-Request-Start $msec;
location /app/ {
    add_header X-Frame-Options "DENY" always;
    proxy_hide_header X-Powered-By;
    proxy_intercept_errors on;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    proxy_connect_timeout 5s;
    proxy_buffering off;
    proxy_request_buffering off;
    client_max_body_size 20m;
    limit_req zone=opscrew_shop burst=10 nodelay;
    limit_req_status 429;
    error_page 502 = @down;
    proxy_redirect http://app-web:3000/ /app/;
    proxy_pass http://app-web:3000;
}
location @down {
    return 503;
}
location /maintenance {
    internal;
    return 503;
}
location ~ ^/old/(.*)$ {
    if ($request_method = POST) {
        return 405;
    }
    rewrite ^/old/(.*)$ /new/$1 break;
    proxy_pass http://app-web:3000;
}
location /private/ {
    allow 192.0.2.0/24;
    deny all;
    proxy_pass http://app-web:3000;
}
location /assets/ {
    if ($http_x_skip) {
        break;
    }
    expires 30d;
    etag on;
    charset utf-8;
    gzip on;
    gzip_types text/css application/javascript;
    gzip_min_length 256;
    gzip_vary on;
    gzip_proxied any;
    proxy_pass http://app-web:3000;
}
