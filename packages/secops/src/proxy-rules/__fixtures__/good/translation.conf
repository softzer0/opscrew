# Translated from vercel.json: headers, then redirects, then rewrites.
location /about {
    add_header Cache-Control "public, max-age=3600" always;
    proxy_pass http://app-web:3000;
}
location = /old {
    return 308 /new;
}
location = /blog {
    return 301 https://www.app.example.com/blog;
}
location = /docs {
    return 302 https://docs.external.example/;
}
location ~ ^/posts/(?<slug>[^/]+)/$ {
    return 308 /posts/$slug;
}
location / {
    proxy_intercept_errors on;
    error_page 404 = @rewrite_0;
    proxy_pass http://app-web:3000;
}
location @rewrite_0 {
    rewrite ^ /index.html break;
    proxy_pass http://app-web:3000;
}
