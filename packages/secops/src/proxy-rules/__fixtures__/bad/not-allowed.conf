location /x {
    sub_filter 'a' 'b'; # refused: not-allowed
    mirror /m; # refused: not-allowed
    proxy_store on; # refused: not-allowed
    proxy_temp_path /tmp/x; # refused: not-allowed
    try_files $uri =404; # refused: not-allowed
    set $a 1; # refused: not-allowed
    proxy_pass http://app-web:3000;
}
