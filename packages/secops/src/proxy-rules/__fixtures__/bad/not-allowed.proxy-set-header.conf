# In a block, proxy_set_header would make nginx drop OpsCrew's Host and X-Forwarded-* there.
proxy_set_header X-Request-Start $msec;
location /api/ {
    proxy_set_header X-Real-IP $remote_addr; # refused: not-allowed
    proxy_pass http://app-web:3000;
}
location /upload/ {
    if ($request_method = POST) {
        proxy_set_header X-Upload yes; # refused: not-allowed
    }
    proxy_pass http://app-web:3000;
}
