location /other {
    proxy_pass http://other-app:3000; # refused: upstream
}
location /php {
    fastcgi_pass 127.0.0.1:9000; # refused: upstream
}
location /grpc {
    grpc_pass grpc://app-web:3001; # refused: upstream
}
location /wsgi {
    uwsgi_pass uwsgi://app-web:3000.attacker.example; # refused: upstream
}
location /var {
    proxy_pass http://$http_x_target; # refused: upstream
}
location /userinfo {
    "proxy_pass" http://app-web:3000@attacker.example; # refused: upstream
}
location /memcached {
    memcached_pass cache:11211; # refused: upstream
}
